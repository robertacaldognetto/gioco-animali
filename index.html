<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gioco Magico Italiano</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to bottom, #74ebd5, #acb6e5);
}

.card {
  background: white;
  padding: 20px;
  margin: 30px auto;
  width: 380px;
  border-radius: 20px;
}

.big {
  font-size: 45px;
  margin: 15px;
}

.score {
  font-size: 18px;
  margin: 10px;
}

button {
  padding: 12px;
  margin: 5px;
  border: none;
  border-radius: 12px;
  background: #ff7675;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #d63031;
}

.choice {
  display: block;
  width: 80%;
  margin: 8px auto;
  background: #55efc4;
  color: black;
}
</style>

</head>
<body>

<div class="card" id="menu">
  <h2>🎮 Gioco Magico</h2>
  <button onclick="start()">Inizia</button>
</div>

<div class="card" id="game" style="display:none;">
  <div class="score">⭐ Punti: <span id="score">0</span></div>
  <div class="big" id="emoji"></div>
  <h3 id="question"></h3>

  <div id="choices"></div>

  <p id="msg"></p>
</div>

<script>
const giochi = [
  {
    emoji:"🐱",
    domanda:"Scegli la parola giusta",
    corretta:"gatto",
    opzioni:["gato","gatto","gatoo"]
  },
  {
    emoji:"🐶",
    domanda:"Completa con suono giusto",
    corretta:"cane",
    opzioni:["kane","cane","qane"]
  },
  {
    emoji:"🐮",
    domanda:"Trova la doppia",
    corretta:"mucca",
    opzioni:["muca","mucca","mukka"]
  },
  {
    emoji:"👗",
    domanda:"Qual è giusta?",
    corretta:"gonna",
    opzioni:["gona","gonna","gonaa"]
  }
];

let i = 0;
let score = 0;

function start(){
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  load();
}

function load(){
  let g = giochi[i];
  document.getElementById("emoji").innerText = g.emoji;
  document.getElementById("question").innerText = g.domanda;

  let div = document.getElementById("choices");
  div.innerHTML = "";

  g.opzioni.forEach(op => {
    let b = document.createElement("button");
    b.className = "choice";
    b.innerText = op;
    b.onclick = () => check(op);
    div.appendChild(b);
  });

  document.getElementById("msg").innerText = "";
}

function check(val){
  if(val === giochi[i].corretta){
    score++;
    document.getElementById("score").innerText = score;
    document.getElementById("msg").innerText = "🎉 Giusto!";
    i = (i+1)%giochi.length;
    setTimeout(load,800);
  } else {
    document.getElementById("msg").innerText = "❌ Riprova!";
  }
}
</script>

</body>
</html>
