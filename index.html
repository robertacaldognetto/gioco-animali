<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gioco Italiano</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to bottom, #a8edea, #fed6e3);
}

.card {
  background: white;
  padding: 20px;
  margin: 40px auto;
  width: 380px;
  border-radius: 20px;
}

.big {
  font-size: 40px;
  margin: 15px;
}

.letters {
  margin: 10px;
}

.letter {
  display: inline-block;
  padding: 10px;
  margin: 5px;
  background: #6c5ce7;
  color: white;
  border-radius: 8px;
  cursor: grab;
}

.dropzone {
  display: inline-block;
  width: 30px;
  height: 40px;
  border-bottom: 3px solid black;
  margin: 2px;
  font-size: 22px;
}

button {
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #6c5ce7;
  color: white;
}
</style>

</head>
<body>

<div class="card">
  <h2>Completa la parola</h2>
  <div class="big" id="emoji"></div>

  <div id="word"></div>

  <div class="letters" id="letters"></div>

  <button onclick="check()">Controlla</button>
  <p id="msg"></p>
</div>

<script>
const giochi = [
  {emoji:"🐱", parola:"gatto"},
  {emoji:"🐶", parola:"cane"},
  {emoji:"🐮", parola:"mucca"},
  {emoji:"🦁", parola:"leone"}
];

let current = 0;
let risposta = [];

function load(){
  let p = giochi[current].parola;
  document.getElementById("emoji").innerText = giochi[current].emoji;

  let wordDiv = document.getElementById("word");
  wordDiv.innerHTML = "";
  risposta = [];

  for(let i=0;i<p.length;i++){
    if(Math.random() < 0.5){
      wordDiv.innerHTML += `<span class='dropzone' ondrop='drop(event,${i})' ondragover='allowDrop(event)'></span>`;
      risposta.push("");
    } else {
      wordDiv.innerHTML += `<span class='dropzone'>${p[i]}</span>`;
      risposta.push(p[i]);
    }
  }

  let lettersDiv = document.getElementById("letters");
  lettersDiv.innerHTML = "";

  for(let i=0;i<p.length;i++){
    let l = p[i];
    let el = document.createElement("div");
    el.className = "letter";
    el.draggable = true;
    el.innerText = l;
    el.id = "l"+i;
    el.ondragstart = drag;
    lettersDiv.appendChild(el);
  }

  document.getElementById("msg").innerText = "";
}

function allowDrop(ev){
  ev.preventDefault();
}

function drag(ev){
  ev.dataTransfer.setData("text", ev.target.innerText);
}

function drop(ev, index){
  ev.preventDefault();
  let data = ev.dataTransfer.getData("text");
  ev.target.innerText = data;
  risposta[index] = data;
}

function check(){
  let parola = giochi[current].parola;
  if(risposta.join("") === parola){
    document.getElementById("msg").innerText = "🎉 Bravo!";
    current = (current+1)%giochi.length;
    setTimeout(load,1000);
  } else {
    document.getElementById("msg").innerText = "😊 Riprova";
  }
}

load();
</script>

</body>
</html>
