<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gioco Magico</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  height: 100vh;
  background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a1c4fd, #c2ffd8);
  background-size: 800% 800%;
  animation: bgMove 15s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
}

@keyframes bgMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container {
  width: 100%;
  max-width: 700px;
}

.big {
  font-size: 90px;
}

h1 {
  font-size: 40px;
  color: white;
}

.score {
  font-size: 25px;
  color: white;
  margin: 10px;
}

button {
  display: block;
  width: 80%;
  margin: 10px auto;
  padding: 20px;
  font-size: 22px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  background: #ffdd59;
}

button:hover {
  transform: scale(1.05);
}

.msg {
  font-size: 28px;
  color: white;
  height: 40px;
}
</style>

</head>
<body>

<div class="container">

<div id="menu">
  <h1>🎮 Gioco Magico</h1>
  <button onclick="start()">INIZIA</button>
</div>

<div id="game" style="display:none;">
  <div class="score">⭐ Punti: <span id="score">0</span></div>
  <div class="big" id="emoji"></div>
  <h1 id="question"></h1>

  <div id="choices"></div>

  <div class="msg" id="msg"></div>
</div>

</div>

<script>
const giochi = [
  {
    emoji:"🐱",
    domanda:"Qual è giusta?",
    corretta:"gatto",
    opzioni:["gato","gatto","gatoo"]
  },
  {
    emoji:"🐶",
    domanda:"Scegli bene",
    corretta:"cane",
    opzioni:["kane","cane","qane"]
  },
  {
    emoji:"🐮",
    domanda:"Trova la doppia",
    corretta:"mucca",
    opzioni:["muca","mucca","mukka"]
  },
  {
    emoji:"👗",
    domanda:"Qual è corretta?",
    corretta:"gonna",
    opzioni:["gona","gonna","gonaa"]
  }
];

let i = 0;
let score = 0;

function start(){
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  load();
}

function load(){
  let g = giochi[i];
  document.getElementById("emoji").innerText = g.emoji;
  document.getElementById("question").innerText = g.domanda;

  let div = document.getElementById("choices");
  div.innerHTML = "";

  g.opzioni.forEach(op => {
    let b = document.createElement("button");
    b.innerText = op;
    b.onclick = () => check(op);
    div.appendChild(b);
  });

  document.getElementById("msg").innerText = "";
}

function check(val){
  if(val === giochi[i].corretta){
    score++;
    document.getElementById("score").innerText = score;
    document.getElementById("msg").innerText = "🎉 GIUSTO!";
    i = (i+1)%giochi.length;
    setTimeout(load,800);
  } else {
    document.getElementById("msg").innerText = "❌ Riprova!";
  }
}
</script>

</body>
</html>
