<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Acchiappa La Parola</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  height: 100vh;
  background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a1c4fd, #c2ffd8);
  background-size: 800% 800%;
  animation: bgMove 15s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
}

@keyframes bgMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container { width: 100%; max-width: 800px; }

.big { font-size: 90px; }

h1 { font-size: 40px; color: white; }

.score { font-size: 25px; color: white; }

button {
  display: block;
  width: 80%;
  margin: 10px auto;
  padding: 20px;
  font-size: 22px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  background: #ffdd59;
}

.msg { font-size: 28px; color: white; height: 40px; }

.logo {
  width: 180px;
  margin-bottom: 10px;
  cursor: pointer;
}
</style>

</head>
<body>

<div class="container">

<!-- MENU -->
<div id="menu">
  <a href="https://www.goccedimemoria.info/" target="_blank">
    <img class="logo" src="https://www.goccedimemoria.info/wp-content/uploads/2020/03/logo-gocce-di-memoria.png">
  </a>
  <h1>🎮 Acchiappa La Parola</h1>
  <button onclick="start()">INIZIA</button>
</div>

<!-- GIOCO -->
<div id="game" style="display:none;">
  <a href="https://www.goccedimemoria.info/" target="_blank">
    <img class="logo" src="https://www.goccedimemoria.info/wp-content/uploads/2020/03/logo-gocce-di-memoria.png">
  </a>

  <div class="score">⭐ Giuste: <span id="giuste">0</span> | ❌ Errori: <span id="errori">0</span></div>
  <div class="big" id="emoji"></div>
  <h1>Scegli la parola giusta</h1>
  <div id="choices"></div>
  <div class="msg" id="msg"></div>
</div>

<!-- FINE -->
<div id="fine" style="display:none;">
  <a href="https://www.goccedimemoria.info/" target="_blank">
    <img class="logo" src="https://www.goccedimemoria.info/wp-content/uploads/2020/03/logo-gocce-di-memoria.png">
  </a>

  <h1>🎉 RISULTATO FINALE</h1>
  <h2 id="risultato"></h2>
  <button onclick="restart()">RIGIOCA</button>
</div>

</div>

<script>

const giustoSound = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const erroreSound = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");

const giochi = [
{emoji:"🐱", corretta:"gatto", opzioni:["gato","gatto","gatoo"]},
{emoji:"🐶", corretta:"cane", opzioni:["kane","cane","qane"]},
{emoji:"🐮", corretta:"mucca", opzioni:["muca","mucca","mukka"]},
{emoji:"🐸", corretta:"rana", opzioni:["rrana","rana","ranae"]},
{emoji:"🐷", corretta:"maiale", opzioni:["maiale","maialle","maale"]},
{emoji:"🐔", corretta:"gallina", opzioni:["galina","gallina","galllina"]},
{emoji:"🐴", corretta:"cavallo", opzioni:["cavalo","cavallo","cavallo"]},
{emoji:"🐘", corretta:"elefante", opzioni:["elefante","elefannte","elefant"]},
{emoji:"🐟", corretta:"pesce", opzioni:["pesce","pesse","peshe"]},
{emoji:"🍎", corretta:"mela", opzioni:["mela","mella","melaa"]},
{emoji:"🍌", corretta:"banana", opzioni:["banana","bananna","banan"]},
{emoji:"🍕", corretta:"pizza", opzioni:["piza","pizza","pizzza"]},
{emoji:"🚗", corretta:"auto", opzioni:["auto","autto","ato"]},
{emoji:"🏫", corretta:"scuola", opzioni:["scuola","scuolla","squola"]},
{emoji:"📚", corretta:"libro", opzioni:["libro","libbro","libroo"]},
{emoji:"✏️", corretta:"penna", opzioni:["pena","penna","penna"]},
{emoji:"🌞", corretta:"sole", opzioni:["sole","solle","sol"]},
{emoji:"🌙", corretta:"luna", opzioni:["luna","lunna","lunae"]},
{emoji:"⭐", corretta:"stella", opzioni:["stela","stella","stellla"]},
{emoji:"🌧️", corretta:"pioggia", opzioni:["piogia","pioggia","piogga"]}
];

let i = 0;
let giuste = 0;
let errori = 0;

function start(){
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  load();
}

function load(){
  if(i >= giochi.length){
    fineGioco();
    return;
  }

  let g = giochi[i];
  document.getElementById("emoji").innerText = g.emoji;

  let div = document.getElementById("choices");
  div.innerHTML = "";

  g.opzioni.sort(()=>Math.random()-0.5).forEach(op => {
    let b = document.createElement("button");
    b.innerText = op;
    b.onclick = () => check(op);
    div.appendChild(b);
  });

  document.getElementById("msg").innerText = "";
}

// 🔊 VOCE PIÙ LENTA
function speak(testo){
  let speech = new SpeechSynthesisUtterance(testo);
  speech.lang = "it-IT";
  speech.rate = 0.6; // ← più lenta
  speech.pitch = 1;
  speech.volume = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}

function check(val){
  let corretta = giochi[i].corretta;

  if(val === corretta){
    giustoSound.play();
    speak(corretta);
    giuste++;
    document.getElementById("msg").innerText = "🎉 GIUSTO!";
  } else {
    erroreSound.play();
    errori++;
    document.getElementById("msg").innerText = "❌ Era: " + corretta;
    speak(corretta);
  }

  document.getElementById("giuste").innerText = giuste;
  document.getElementById("errori").innerText = errori;

  i++;
  setTimeout(load,1200);
}

function fineGioco(){
  document.getElementById("game").style.display="none";
  document.getElementById("fine").style.display="block";

  document.getElementById("risultato").innerText =
    "⭐ Giuste: " + giuste + "   ❌ Errori: " + errori;
}

function restart(){
  i = 0;
  giuste = 0;
  errori = 0;

  document.getElementById("fine").style.display="none";
  document.getElementById("game").style.display="block";

  load();
}

</script>

</body>
</html>
